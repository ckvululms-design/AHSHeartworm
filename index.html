const Icon = ({ name, size = 24, className = "" }) => {
  const spanRef = React.useRef(null);
  
  useEffect(() => {
    if (window.lucide && spanRef.current) {
      window.lucide.createIcons({ root: spanRef.current });
    }
  }, [name, size, className]);

  return (
    <span 
      ref={spanRef} 
      style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
      dangerouslySetInnerHTML={{
        __html: `<i data-lucide="${name}" style="width: ${size}px; height: ${size}px;" class="${className}"></i>`
      }}
    />
  );
};

        const addDays = (dateStr, days) => {
            if (!dateStr) return "";
            const result = new Date(dateStr);
            if (isNaN(result.getTime())) return "";
            result.setDate(result.getDate() + days);
            return result.toISOString().split('T')[0];
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const t = translations[lang];

            const initialDayZero = new Date().toISOString().split('T')[0];
            const [dayZero, setDayZero] = useState(initialDayZero);
            const [isSymptomatic, setIsSymptomatic] = useState(false);
            const [actualDates, setActualDates] = useState({
                inj1: addDays(initialDayZero, 60),
                inj2: addDays(initialDayZero, 90),
                inj3: addDays(initialDayZero, 91)
            });

            const formatDate = (dateStr) => {
                if (!dateStr) return "---";
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return "Invalid";
                const y = d.getFullYear();
                const m = d.getMonth() + 1;
                const day = d.getDate();
                const w = t.weekdays[d.getDay()];
                return `${y}/${m}/${day} (${w})`;
            };

            useEffect(() => {
                if (dayZero) {
                    setActualDates({
                        inj1: addDays(dayZero, 60),
                        inj2: addDays(dayZero, 90),
                        inj3: addDays(dayZero, 91)
                    });
                }
            }, [dayZero]);

            const handleInj1Change = (newDate) => {
                setActualDates(prev => ({
                    ...prev,
                    inj1: newDate,
                    inj2: addDays(newDate, 30),
                    inj3: addDays(newDate, 31)
                }));
            };

            const handleInj2Change = (newDate) => {
                setActualDates(prev => ({
                    ...prev,
                    inj2: newDate,
                    inj3: addDays(newDate, 1)
                }));
            };

            const s = useMemo(() => {
                if (!dayZero) return null;
                const getPredTable = (baseDateStr) => [
                    { label: t.pred_w1, range: `${formatDate(baseDateStr)} - ${formatDate(addDays(baseDateStr, 6))}` },
                    { label: t.pred_w2, range: `${formatDate(addDays(baseDateStr, 7))} - ${formatDate(addDays(baseDateStr, 13))}` },
                    { label: t.pred_w34, range: `${formatDate(addDays(baseDateStr, 14))} - ${formatDate(addDays(baseDateStr, 27))}` }
                ];

                return {
                    d0: formatDate(dayZero),
                    doxy: { start: formatDate(dayZero), end: formatDate(addDays(dayZero, 27)) },
                    symptomaticPred: isSymptomatic ? [
                        { label: t.pred_w1, range: `${formatDate(dayZero)} - ${formatDate(addDays(dayZero, 6))}` },
                        { label: t.pred_w2, range: `${formatDate(addDays(dayZero, 7))} - ${formatDate(addDays(dayZero, 13))}` },
                        { label: t.pred_w34, range: `${formatDate(addDays(dayZero, 14))} - ${formatDate(addDays(dayZero, 27))}` }
                    ] : null,
                    prevention: [
                        { day: 'D0', date: formatDate(dayZero) },
                        { day: 'D30', date: formatDate(addDays(dayZero, 30)) },
                        { day: 'D60', date: formatDate(addDays(dayZero, 60)) },
                        { day: 'D90', date: formatDate(addDays(dayZero, 90)) }
                    ],
                    nextPrevention: formatDate(addDays(dayZero, 120)),
                    inj1_data: { id: 'inj1', label: t.inj1_label, standard: 'Day 60', calcDate: formatDate(addDays(dayZero, 60)), pred: getPredTable(actualDates.inj1) },
                    inj23_data: { label: t.inj23_seq_label, pred: getPredTable(actualDates.inj2) },
                    day120: formatDate(addDays(actualDates.inj3, 29)),
                    retest: formatDate(addDays(actualDates.inj3, 270))
                };
            }, [dayZero, isSymptomatic, actualDates, lang]);

if (!s) return (
  <div className="min-h-screen flex items-center justify-center p-4 bg-[#FDFBF7]">
    <div className="text-center text-slate-400 font-bold text-lg p-8 rounded-2xl border-2 border-dashed border-slate-200">
      <Icon name="calendar-x-2" size={48} className="mx-auto mb-4 text-slate-300" />
      請輸入或選擇確診日期 (Day 0) 以產生計畫表...
    </div>
  </div>
);

            return (
                <div className="min-h-screen p-4 print:p-0 font-bold">

                                <div className="flex items-center gap-2">
                                    <Icon name="languages" size={20} className="text-orange-400" />

                                        {['zh', 'en', 'ja'].map(l => (
                                            <button key={l} onClick={()=>setLang(l)} className={`px-4 py-1.5 rounded-lg text-sm transition-all ${lang === l ? 'bg-white shadow-sm text-orange-600' : 'text-slate-400'}`}>
                                                {l === 'zh' ? '繁中' : l === 'en' ? 'English' : '日本語'}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="text-[10px] text-slate-400 font-black tracking-widest uppercase italic">AHS Protocol Visualizer v2.8</div>
                            </div>

                            <div className="flex flex-col md:flex-row gap-8 items-start">
                                <div className="flex-1 w-full">
                                    <label className="block text-xs font-black text-slate-400 mb-1 uppercase tracking-widest px-1">{t.day_zero}</label>
                                    <input type="date" value={dayZero} onChange={(e)=>setDayZero(e.target.value)} className="w-full p-3 border-4 border-slate-50 rounded-2xl text-lg font-black focus:border-orange-200 outline-none shadow-inner" />
                                </div>
                                <div className="flex-[1.5] w-full">
                                    <label className="block text-xs font-black text-slate-400 mb-1 uppercase tracking-widest px-1">{t.clinical_class}</label>
                                    <button onClick={()=>setIsSymptomatic(!isSymptomatic)} className={`w-full p-3 rounded-2xl border-4 font-black text-lg flex justify-between items-center transition-all ${isSymptomatic ? 'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-inner' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                                        <span>{isSymptomatic ? t.class_btn_symptomatic : t.class_btn_asymptomatic}</span>
                                        <Icon name="activity" size={20} className={isSymptomatic ? 'animate-pulse' : ''}/>
                                    </button>
                                    <div className="mt-2 grid grid-cols-1 gap-1 text-[10px] px-1 font-bold text-slate-400 leading-tight">
                                        <p><span className="text-teal-600">● Class 1:</span> {t.class1_desc}</p>
                                        <p><span className="text-indigo-600">● Class 2:</span> {t.class2_desc}</p>
                                        <p><span className="text-red-500">● Class 3:</span> {t.class3_desc}</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 畫布 */}
                        <div className="bg-white shadow-2xl print:shadow-none p-6 md:p-8 rounded-sm border border-slate-100 print:border-0 landscape-layout relative">
                            <header className="mb-5 text-center border-b-4 border-orange-100 pb-3">
                                <h1 className="text-4xl font-black text-[#FF8C42] tracking-tighter mb-1">{t.title}</h1>
                                <p className="text-xs text-slate-500 font-bold italic">{t.ahs_ref}</p>
                            </header>

                            <div className="grid grid-cols-12 gap-5">
                                <div className="col-span-4 space-y-4">
                                    <div className="bg-teal-50/40 p-4 rounded-3xl border-2 border-teal-100">
                                        <h2 className="font-black text-teal-800 text-xl mb-3 flex items-center gap-2 border-b-2 border-teal-200/60 pb-1">
                                            <Icon name="check-circle-2" size={22}/> {t.phase1_title}
                                        </h2>
                                        <div className="space-y-3">
                                            <div className="flex justify-between font-black text-base bg-white p-2.5 rounded-xl border border-teal-100/60 shadow-sm">
                                                <span className="text-slate-500">{t.confirmed_date}</span>
                                                <span className="text-teal-700">{s.d0}</span>
                                            </div>
                                            <div className="bg-white p-3 rounded-xl border border-teal-100/60 shadow-sm">
                                                <span className="text-[10px] font-black text-teal-600 block mb-1 uppercase">{t.doxy_title}</span>
                                                <p className="font-black text-slate-800 text-base">{s.doxy.start} — {s.doxy.end}</p>
                                                <p className="text-[10px] text-slate-400 mt-1 italic">{t.doxy_desc}</p>
                                            </div>
                                            {isSymptomatic && s.symptomaticPred && (
                                                <div className="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 shadow-sm">
                                                    <span className="text-[10px] font-black text-indigo-700 block mb-1">{t.pred_title}</span>
                                                    {s.symptomaticPred.map((p,i)=>(
                                                        <div key={i} className="flex justify-between text-[10px] font-black border-b border-indigo-100/50 py-1 last:border-0">
                                                            <span>{p.label}</span>
                                                            <span className="text-slate-600 font-medium">{p.range}</span>
                                                        </div>
                                                    ))}
                                                    <p className="mt-2 text-[9px] text-indigo-800 font-bold leading-tight italic bg-white/50 p-1.5 rounded-lg border border-indigo-100">
                                                        {t.stabilization_note}
                                                    </p>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-white p-4 rounded-3xl border-2 border-slate-200 shadow-lg relative overflow-hidden">
                                        <h3 className="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-[0.2em] flex items-center gap-1 px-1">
                                            <Icon name="heart" size={14} className="text-red-400" /> {t.prevention_title}
                                        </h3>
                                        <div className="grid grid-cols-2 gap-2 mb-2">
                                            {s.prevention.map((p,i)=>(
                                                <div key={i} className={`p-2 rounded-xl border-l-4 ${i >= 2 ? 'border-orange-300 bg-orange-50/40' : 'border-teal-300 bg-teal-50/40'}`}>
                                                    <span className="text-[8px] text-slate-400 block font-black mb-0.5">{p.day}</span>
                                                    <span className="font-black text-slate-700 text-xs">{p.date}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="bg-red-600 text-white p-2.5 rounded-2xl text-center border-2 border-red-200 shadow-md">
                                            <p className="text-[10px] font-black opacity-90 mb-0.5">{t.prevention_footer.replace('{date}', s.nextPrevention)}</p>
                                            <p className="text-lg font-black tracking-tight leading-none underline underline-offset-4 font-black">{t.lifelong_prevention}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="col-span-8 space-y-4">
                                    <div className="bg-orange-50/50 p-4 rounded-[32px] border-2 border-orange-100">
                                        <h2 className="font-black text-orange-800 text-xl mb-3 flex items-center gap-3 border-b-2 border-orange-200/60 pb-1">
                                            <Icon name="calendar" size={24}/> {t.phase2_title}
                                        </h2>
                                        
                                        <div className="grid grid-cols-2 gap-4 mb-4">
                                            {/* 第一劑區塊 - 佔 1/2 寬度 */}
                                            <div className="bg-white p-3.5 rounded-3xl border-2 border-orange-100 shadow-sm relative">
                                                <div className="mb-2 border-b-2 border-orange-50 pb-2 flex justify-between items-start">
                                                    <div>
                                                        <span className="font-black text-orange-800 text-base block leading-tight">{s.inj1_data.label}</span>
                                                        <span className="text-[9px] text-slate-400 font-black italic tracking-tighter">{t.standard_label}{s.inj1_data.calcDate}</span>
                                                    </div>
                                                    <div className="text-right">
                                                        <label className="text-[9px] font-black text-orange-400 block uppercase no-print">{t.actual_label}</label>
                                                        <input type="date" value={actualDates.inj1 || ""} onChange={(e) => handleInj1Change(e.target.value)} className="text-xs font-black text-slate-900 border border-orange-100 rounded px-1 outline-none no-print w-28" />
                                                        <span className="hidden print:block text-sm font-black text-slate-900">{formatDate(actualDates.inj1)}</span>
                                                    </div>
                                                </div>
                                                <div className="mt-2">
                                                    <span className="text-[9px] font-black text-blue-600 block mb-1 flex items-center gap-1 uppercase">
                                                       <Icon name="shield-check" size={10}/> {t.inj1_post} {t.post_pred_title}
                                                    </span>
                                                    <div className="grid grid-cols-1 gap-0.5">
                                                        {s.inj1_data.pred.map((p,pi)=>(
                                                            <div key={pi} className="flex justify-between text-[10px] font-black py-0.5 border-b border-blue-50/50 last:border-0">
                                                                <span className="text-blue-800">{p.label}</span>
                                                                <span className="text-slate-500 font-medium">{p.range}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="mt-2 p-2 bg-amber-50 rounded-xl text-[9px] text-amber-800 font-bold leading-tight border border-amber-100 flex items-start gap-1">
                                                    <Icon name="alert-triangle" size={12} className="shrink-0 mt-0.5"/>
                                                    <span>{t.warning_inj1}</span>
                                                </div>
                                            </div>

                                            {/* 二三劑連動區塊 - 佔 1/2 寬度 */}
                                            <div className="bg-white p-3.5 rounded-3xl border-2 border-orange-200 shadow-md ring-2 ring-orange-100 relative">
                                                <div className="mb-2 border-b-2 border-orange-100 pb-2">
                                                    <span className="font-black text-orange-900 text-base block leading-tight mb-2">{t.inj23_seq_label}</span>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <div>
                                                            <label className="text-[8px] font-black text-slate-400 block uppercase">{t.inj2_label}</label>
                                                            <input type="date" value={actualDates.inj2 || ""} onChange={(e) => handleInj2Change(e.target.value)} className="text-[10px] font-black text-slate-900 border border-slate-200 rounded px-1 outline-none no-print w-full" />
                                                            <span className="hidden print:block text-xs font-black text-slate-900">{formatDate(actualDates.inj2)}</span>
                                                        </div>
                                                        <div>
                                                            <label className="text-[8px] font-black text-slate-400 block uppercase">{t.inj3_label}</label>
                                                            <div className="text-[10px] font-black text-slate-400 bg-slate-50 border border-slate-100 rounded px-1 no-print h-[22px] flex items-center">{actualDates.inj3}</div>
                                                            <span className="hidden print:block text-xs font-black text-slate-900">{formatDate(actualDates.inj3)}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="mt-2">
                                                    <span className="text-[9px] font-black text-blue-600 block mb-1 flex items-center gap-1 uppercase">
                                                       <Icon name="shield-check" size={10}/> {t.inj23_post} {t.post_pred_title}
                                                    </span>
                                                    <div className="grid grid-cols-1 gap-0.5">
                                                        {s.inj23_data.pred.map((p,pi)=>(
                                                            <div key={pi} className="flex justify-between text-[10px] font-black py-0.5 border-b border-blue-50/50 last:border-0">
                                                                <span className="text-blue-800">{p.label}</span>
                                                                <span className="text-slate-500 font-medium">{p.range}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="mt-2 p-2 bg-blue-50 rounded-xl text-[9px] text-blue-800 font-bold leading-tight border border-blue-100 flex items-start gap-1">
                                                    <Icon name="link" size={12} className="shrink-0 mt-0.5"/>
                                                    <span>{t.warning_inj3}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            {/* Day 120 檢查項 */}
                                            <div className="bg-indigo-50 p-4 rounded-3xl border-2 border-indigo-200 flex items-start gap-3 shadow-sm relative overflow-hidden">
                                                <div className="bg-indigo-600 text-white p-2 rounded-2xl shadow-md">
                                                    <Icon name="microscope" size={20} />
                                                </div>
                                                <div className="flex-1">
                                                    <span className="text-[10px] font-black text-indigo-700 uppercase tracking-widest block mb-1">{t.followup_120_title}</span>
                                                    <div className="text-xl font-black text-indigo-950 mb-1">{s.day120}</div>
                                                    <p className="text-[9px] text-indigo-600 font-bold leading-tight">{t.followup_120_desc}</p>
                                                </div>
                                                <div className="absolute -right-2 -bottom-2 opacity-10 text-indigo-900">
                                                    <Icon name="activity" size={64} />
                                                </div>
                                            </div>

                                            {/* Retest 複驗項 */}
                                            <div className="bg-amber-100 p-4 rounded-3xl border-2 border-amber-200 flex items-start gap-3 shadow-sm">
                                                <div className="bg-amber-600 text-white p-2 rounded-2xl shadow-md">
                                                    <Icon name="search" size={20} />
                                                </div>
                                                <div className="flex-1">
                                                    <span className="text-[10px] font-black text-amber-800 uppercase tracking-widest block mb-1">{t.retest_title}</span>
                                                    <div className="text-xl font-black text-amber-950 mb-1">{s.retest}</div>
                                                    <p className="text-[9px] text-amber-600 font-bold italic">{t.retest_footer}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-slate-100/50 p-4 rounded-[32px] border-2 border-slate-200 relative shadow-inner">
                                        <h4 className="text-[10px] font-black text-slate-800 mb-2 flex items-center gap-2 uppercase tracking-[0.2em]">
                                            <Icon name="shield-check" size={18} className="text-orange-500"/> {t.regulations_title}
                                        </h4>
                                        <div className="grid grid-cols-2 gap-x-8 gap-y-2 text-[11px] font-black text-slate-600 leading-tight">
                                            <div className="flex gap-2"><span>•</span><span>{t.rule_exercise.split('：')[0]}：<span className="text-red-600 underline">{t.rule_exercise.split('：')[1]}</span></span></div>
                                            <div className="flex gap-2"><span>•</span><span>{t.rule_prevention.split('：')[0]}：<span className="text-teal-600">{t.rule_prevention.split('：')[1]}</span></span></div>
                                            <div className="flex gap-2"><span>•</span><span>{t.rule_pred.split('：')[0]}：<span className="text-blue-600 underline">{t.rule_pred.split('：')[1]}</span></span></div>
                                            <div className="flex gap-2"><span>•</span><span><span className="text-red-600">{t.rule_emergency}</span></span></div>
                                        </div>
                                        <div className="mt-3 pt-2 border-t border-slate-200/50">
                                           <p className="text-[10px] text-slate-500 font-bold italic leading-relaxed">
                                             {t.slow_kill_stmt}
                                           </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <footer className="mt-5 pt-3 border-t-2 border-slate-50 flex justify-between items-end px-4">
                                <div className="flex flex-col gap-1">
                                    <div className="text-[9px] font-black text-slate-300 tracking-[0.4em] uppercase pb-1">
                                        {t.footer_ahs}
                                    </div>
                                    <div className="no-print text-[9px] text-slate-300 font-bold flex gap-3">
                                        <span id="busuanzi_container_site_pv">
                                            {t.pv_label}<span id="busuanzi_value_site_pv">--</span>
                                        </span>
                                        <span id="busuanzi_container_site_uv">
                                            {t.uv_label}<span id="busuanzi_value_site_uv">--</span>
                                        </span>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end">
                                    <div className="flex items-center gap-1.5 text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200 shadow-sm">
                                        <Icon name="user" size={14} className="text-slate-400" />
                                        <span className="text-[11px] font-black tracking-widest">{t.author}</span>
                                    </div>
                                </div>
                            </footer>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
